name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk
          pip install buildozer
      
      - name: Accept SDK licenses
        run: |
          # Önce buildozer'ı çalıştır (SDK indirilsin)
          buildozer android debug || true
          # Lisansları manuel kabul et (farklı yöntem)
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager --licenses
          # SDK'yi güncelle
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --update
      
      - name: Build APK
        run: buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-apk
          path: bin/*.apk
